<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2 - Yukarı Toplanan Perde (Geliştirilmiş)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo:#6d1b2c; --bordo-dark:#4a1220; --bordo-light:#8c2a3d;
    --gold:#c9a24b; --gold-light:#e6cd8c; --cream:#faf5ec;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Poppins',sans-serif;overflow:hidden;height:100vh;background:var(--bordo-dark);}

  .hero{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(180deg, var(--bordo-dark) 0%, var(--bordo) 60%, #3a0f19 100%);
    text-align:center; color:var(--cream); flex-direction:column; gap:18px;
  }
  .hero h1{ font-family:'Playfair Display',serif; font-size:3rem; }
  .hero p{ color: var(--gold-light); letter-spacing:3px; text-transform:uppercase; font-size:.9rem; }

  #glow{
    position:fixed; inset:0; z-index:9; pointer-events:none;
    background: radial-gradient(ellipse at 50% 100%, rgba(230,205,140,.4), transparent 65%);
    opacity:0; transition: opacity 1.1s ease;
  }
  #glow.show{ opacity:1; }

  #rod{
    position:fixed; top:0; left:0; right:0; height:20px; z-index:12;
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 40%, #8a6a20);
    box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }

  #panel{
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:10;
    overflow:hidden;
    background-color: var(--bordo);
    background-image:
      repeating-linear-gradient(180deg,
        rgba(255,255,255,.12) 0px, rgba(255,255,255,.12) 4px,
        rgba(0,0,0,0) 4px, rgba(0,0,0,0) 22px,
        rgba(0,0,0,.3) 22px, rgba(0,0,0,.3) 27px,
        rgba(0,0,0,0) 27px, rgba(0,0,0,0) 46px),
      linear-gradient(160deg, var(--bordo) 0%, var(--bordo-dark) 55%, var(--bordo-light) 100%);
    background-size: 100% 46px, 100% 100%;
    background-repeat: repeat-y, no-repeat;
    box-shadow: inset 0 0 100px rgba(0,0,0,.5);
    transition: height 1.35s cubic-bezier(.65,0,.35,1), background-size 1.35s cubic-bezier(.65,0,.35,1);
    animation: panelSettle 1s ease-out;
  }
  @keyframes panelSettle{
    0%{ transform: translateY(-4px) rotate(0deg); }
    35%{ transform: translateY(0) rotate(.35deg); }
    70%{ transform: translateY(0) rotate(-.25deg); }
    100%{ transform: translateY(0) rotate(0deg); }
  }
  #panel.folded{
    height: 6%;
    background-size: 100% 13px, 100% 100%;
  }

  .cords{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .cord{
    position:absolute; top:0; bottom:16px; width:2px;
    background: linear-gradient(180deg, rgba(230,205,140,.7), rgba(230,205,140,.25));
  }
  .cord:nth-child(1){ left:22%; }
  .cord:nth-child(2){ left:50%; }
  .cord:nth-child(3){ left:78%; }
  .cords.tense .cord{ animation: cordPulse .35s ease; }
  @keyframes cordPulse{
    0%,100%{ opacity:.8; }
    50%{ opacity:1; box-shadow:0 0 6px var(--gold-light); }
  }

  #bar{
    position:absolute; bottom:0; left:0; right:0; height:16px; z-index:4;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }

  #replay{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:20;
    background:var(--bordo); color:#fff; border:none; padding:12px 26px; border-radius:50px;
    font-family:inherit; font-weight:600; cursor:pointer; box-shadow:0 10px 24px rgba(0,0,0,.35);
  }
  #replay:hover{ background:var(--gold); color:var(--bordo-dark); }
  .badge{
    position:fixed; top:20px; left:20px; z-index:20; background:rgba(0,0,0,.5); color:var(--gold-light);
    padding:8px 16px; border-radius:20px; font-size:.8rem; letter-spacing:1px; text-transform:uppercase;
  }
</style>
</head>
<body>

<div class="hero">
  <p>Çorum'un Güvenilir Perde Mağazası</p>
  <h1>Özdemir Perde</h1>
</div>

<div class="badge">2 — Yukarı Toplanan (Geliştirilmiş)</div>
<div id="glow"></div>
<div id="rod"></div>
<div id="panel">
  <div class="cords" id="cords">
    <span class="cord"></span><span class="cord"></span><span class="cord"></span>
  </div>
  <div id="bar"></div>
</div>

<button id="replay">🔁 Tekrar Oynat</button>

<script>
function playIntro(){
  var panel = document.getElementById('panel');
  var cords = document.getElementById('cords');
  var glow = document.getElementById('glow');

  panel.style.display = 'block';
  panel.classList.remove('folded');
  glow.classList.remove('show');
  cords.classList.remove('tense');
  void panel.offsetWidth;

  cords.classList.add('tense');

  setTimeout(function(){
    panel.classList.add('folded');
    glow.classList.add('show');
  }, 300);

  setTimeout(function(){
    panel.style.display = 'none';
    glow.classList.remove('show');
  }, 1750);
}

window.addEventListener('load', function(){ setTimeout(playIntro, 400); });
document.getElementById('replay').addEventListener('click', playIntro);
</script>
</body>
</html>
